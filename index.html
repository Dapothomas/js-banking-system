<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Banking System</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #f7f7f9;
    }
    h1 {
      text-align: center;
      color: #1a3d63;
    }
    p {
      line-height: 1.5;
    }
    code {
      background: #eee;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Simple Banking System</h1>

  <div class="card">
    <p>
      This page loads the <code>BankAccount</code> class and a demo script
      that creates accounts, deposits, withdraws, and checks balances.
    </p>
    <p>
      Open your browser's <strong>Developer Console</strong> (F12 or
      Ctrl+Shift+J / Cmd+Option+J) to see the output.
    </p>
  </div>

  <!-- Load the class definition first, then the program that uses it. -->
  <script src="bankAccount.js"></script>
  <script src="index.js"></script>
</body>
</html>
